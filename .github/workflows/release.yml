name: Release Notsky

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish macOS Release
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Build Optimized Release Binary
        run: |
          swift build -c release

      - name: Package Notsky.app Bundle, DMG & Zip
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.3}"
          echo "Packaging release for version: ${VERSION}"
          
          mkdir -p Notsky.app/Contents/{MacOS,Resources}
          cp .build/release/NotskyApp Notsky.app/Contents/MacOS/Notsky
          chmod +x Notsky.app/Contents/MacOS/Notsky
          
          cp Resources/AppIcon.icns Notsky.app/Contents/Resources/ 2>/dev/null || true
          cp Resources/MenuBarIcon*.png Notsky.app/Contents/Resources/ 2>/dev/null || true
          cp -R Resources/Wallpapers/ Notsky.app/Contents/Resources/Wallpapers/ 2>/dev/null || true
          cp Resources/Info.plist Notsky.app/Contents/Info.plist
          
          # Ad-hoc sign bundle
          codesign --force --deep --sign - Notsky.app
          
          # Create DMG staging directory with Applications shortcut
          mkdir -p dmg_staging
          cp -R Notsky.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          
          # Build compressed DMG installer
          hdiutil create -volname "Notsky" -srcfolder dmg_staging -ov -format UDZO "Notsky-${VERSION}-macOS.dmg"
          rm -rf dmg_staging
          
          # Create zip archive
          zip -r -y "Notsky-${VERSION}-macOS.zip" Notsky.app

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Notsky ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body_path: CHANGELOG.md
          files: |
            Notsky-*-macOS.dmg
            Notsky-*-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
